{% extends "base.html" %}
{% block title %}Login | SmartRetail AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Logo Header -->
            <div class="auth-header text-center mb-5">
                <div class="auth-logo mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 11l19-9-9 19-2-8-8-2z"></path>
                        <path d="M12 12l7-7"></path>
                    </svg>
                </div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to your SmartRetail AI account</p>
            </div>

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                <div class="mb-4">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label for="password" class="form-label">Password</label>
                        <a href="#" class="text-sm text-muted">Forgot password?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 auth-btn">
                    <span class="btn-text">Sign In</span>
                    <i class="bi bi-arrow-right"></i>
                </button>

                <div class="auth-divider my-4">
                    <span>or continue with</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn btn-outline-secondary">
                        <i class="bi bi-google"></i> Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary">
                        <i class="bi bi-microsoft"></i> Microsoft
                    </button>
                </div>

                <div class="auth-footer text-center mt-4">
                    <p>Don't have an account? <a href="{{ url_for('register') }}" class="text-link">Create account</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
